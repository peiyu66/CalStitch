<p>操作問題請先看<a href="guide.html">使用說明</a>。若要回報問題或提出建議，可到 <a href="https://github.com/peiyu66/CalStitch/issues">CalStitch GitHub Issues</a> 留言。</p>
<p>請提供 App 版本、iOS 版本及重現步驟。Issues 是公開的，請勿貼上真實姓名、生日、聯絡資料、私人行事曆截圖或其他個人資料。</p>
